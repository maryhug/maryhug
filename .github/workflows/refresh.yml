name: Refresh profile stats

on:
  schedule:
    # Runs every day at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # lets you trigger it manually from GitHub

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Touch SVGs to bust GitHub cache
        run: |
          DATE=$(date +%Y-%m-%d)
          # Add or update a cache-busting comment in both SVGs
          for FILE in maryhug-profile.svg maryhug-profile-dark.svg; do
            if [ -f "$FILE" ]; then
              if grep -q "<!-- cache:" "$FILE"; then
                sed -i "s/<!-- cache:[0-9-]* -->/<!-- cache:$DATE -->/" "$FILE"
              else
                sed -i "s|</svg>|<!-- cache:$DATE -->\n</svg>|" "$FILE"
              fi
              echo "Cache tag updated in $FILE: $DATE"
            fi
          done

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily stats refresh ${{ github.run_number }}"
          file_pattern: "*.svg"
