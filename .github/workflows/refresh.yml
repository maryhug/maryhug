name: Refresh profile stats

on:
  schedule:
    # Runs every day at 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # lets you trigger it manually from GitHub

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Touch SVG to bust GitHub cache
        run: |
          # GitHub caches SVGs aggressively.
          # Adding an invisible comment with today's date forces a fresh render.
          DATE=$(date +%Y-%m-%d)
          sed -i "s/<!-- cache:[0-9-]* -->/<!-- cache:$DATE -->/" maryhug-profile.svg || \
          sed -i "s|<svg |<svg <!-- cache:$DATE --> |" maryhug-profile.svg || true
          echo "Cache tag updated: $DATE"

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily stats refresh ${{ github.run_number }}"
          file_pattern: maryhug-profile.svg
