name: Refresh profile stats

on:
  schedule:
    # Every 5 minutes — keeps Spotify near real-time (GitHub minimum interval)
    - cron: '*/5 * * * *'
  workflow_dispatch: # lets you trigger it manually from GitHub

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update GitHub stats in SVG
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          echo "Running stats updater …"
          python3 update_stats.py

      - name: Bust GitHub SVG cache
        run: |
          DATE=$(date +%Y-%m-%d)
          # Replace existing cache comment with today's date
          sed -i "s/<!-- cache:[0-9-]* -->/<!-- cache:$DATE -->/" maryhug-profile.svg
          echo "Cache tag updated: $DATE"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add maryhug-profile.svg
          git diff --staged --quiet || git commit -m "chore: daily stats refresh [skip ci] ${{ github.run_number }}"
          git push
